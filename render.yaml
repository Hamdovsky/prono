services:
  # ── Node.js Web App (Compte 1) ──────────────────────────
  - type: web
    name: prono
    env: node
    plan: free
    buildCommand: npm install --omit=optional && npm run build
    startCommand: node --expose-gc --max-old-space-size=256 server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: FOOTBALLDATA_ENABLED
        value: "true"
      - key: FOOTBALLDATA_KEY
        sync: false
      - key: FOOTBALLDATA_HOST
        value: footballdata.io
      - key: FOOTBALLDATA_DAILY_LIMIT
        value: "20"
      - key: RAPIDAPI_ENABLED
        value: "true"
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_HOST
        value: sportapi7.p.rapidapi.com
      - key: RAPIDAPI_DAILY_LIMIT
        value: "20"
      - key: HTTP_SCRAPER_ENABLED
        value: "true"
      - key: API_SECRET_KEY
        sync: false
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: REDISMS_DISABLE_POSTINSTALL
        value: "true"
      - key: VITE_API_URL
        value: https://prono-k6gc.onrender.com
      - key: BSD_API_KEY
        sync: false
      - key: THERUNDOWN_KEY
        sync: false
      - key: ODDSPAPI_KEY
        sync: false
      - key: SPORTMONKS_KEY
        sync: false
      - key: APIFOOTBALL_KEY
        sync: false
      - key: OPENWEATHER_KEY
        sync: false
      - key: OPENLIGADB_ENABLED
        value: "true"
      - key: SUPABASE_ENABLED
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # ── URLs des services sur le Compte 2 ──
      - key: INFERENCE_URL
        value: https://prono-fastapi-cnxf.onrender.com
      - key: SCRAPER_WORKER_URL
        value: https://prono-scraper.onrender.com
