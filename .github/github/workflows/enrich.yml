name: Force Enrich

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/auto-enrich
        run: |
          curl -s -X GET "https://prono-dggr.onrender.com/api/cron/auto-enrich" \
            --max-time 120
      - name: Trigger /api/upcoming to refresh cache
        run: |
          curl -s "https://prono-dggr.onrender.com/api/upcoming?days=7&force=true" \
            --max-time 30 > /dev/null
