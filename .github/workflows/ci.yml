name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: --max-old-space-size=512
      API_SECRET_KEY: test-secret-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_URL: https://prono-k6gc-rxjf.onrender.com

      - run: npx jest --passWithNoTests --detectOpenHandles --forceExit
