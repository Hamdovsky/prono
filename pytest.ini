[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# seleniumbase (installed transitively via soccerdata) ships a pytest plugin that
# forbids pytest-timeout's --timeout flag. It's not needed for our tests.
addopts = -p no:seleniumbase
markers =
    smoke: tests de fumée (<5s total, toujours lancés)
    local: tests purement locaux (pas de réseau)
    db: tests qui touchent la DB
    slow: tests réseau (>=1s) — à exclure en CI rapide
    required: tests qui DOIVENT passer (pas de skip conditionnel)
