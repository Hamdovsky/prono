# ─────────────────────────────────────────────────────────
# render-account2.yaml
# À déployer sur le 2ème compte Render
# Services : FastAPI (ML) + Scraper Worker (HTTP)
# ─────────────────────────────────────────────────────────

services:
  # ── Python FastAPI Inference ────────────────────────────
  - type: web
    name: prono-fastapi
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONHASHSEED
        value: "42"
      - key: API_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: neondb

  # ── Serverless Scraper Worker (HTTP-only, ~50MB RAM) ──
  - type: web
    name: prono-scraper
    env: node
    plan: free
    buildCommand: npm install --omit=optional
    startCommand: node --expose-gc --max-old-space-size=128 serverless/scraper-worker.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: API_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_HOST
        value: sportapi7.p.rapidapi.com
      - key: FOOTBALLDATA_KEY
        sync: false
      - key: HTTP_SCRAPER_ENABLED
        value: "true"
      - key: BSD_API_KEY
        sync: false
      - key: PREDIXSPORT_API_KEY
        sync: false
      - key: PREDIXSPORT_API_HOST
        value: "predixsport.p.rapidapi.com"
      - key: BBS_API_KEY
        sync: false
      - key: RAPIDAPI_ENABLED
        value: "true"
      - key: RAPIDAPI_KEY
        sync: false
