name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev
      - run: npx tsc --noEmit

  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --include=dev
      - run: npx eslint .
      - run: npx prettier --check "**/*.{js,jsx,json,css,md,ts}"

  node-tests:
    runs-on: ubuntu-latest

    env:
      NODE_OPTIONS: --max-old-space-size=512
      API_SECRET_KEY: test-secret-key
      JEST_WORKER_ID: 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --include=dev

      - run: npm run build
        env:
          VITE_API_URL: https://pronostico.onrender.com

      - run: npx jest --passWithNoTests --detectOpenHandles --forceExit --no-coverage

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install pytest pytest-cov pytest-timeout
      - run: python -m pytest tests/ --junitxml=report.xml --timeout=120
