# ─────────────────────────────────────────────────────────
# render.yaml — Render Blueprint
# Services : Node.js Web + Python FastAPI (ML Inference)
# Data Source : LiveScore (API publique, pas de clé requise)
# ─────────────────────────────────────────────────────────
services:
  # ── Node.js Main Server (API + React Frontend) ──────
  - type: web
    name: prono-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.production
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: API_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: INFERENCE_URL
        value: https://prono-fastapi.onrender.com
      - key: USE_MODEL_MANAGER
        value: "true"

  # ── Python FastAPI Inference (ML/XGBoost Engine) ────
  - type: web
    name: prono-fastapi
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: API_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
