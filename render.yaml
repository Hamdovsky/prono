# ─────────────────────────────────────────────────────────
# render.yaml — Render Blueprint
# Services : Node.js Web + Python FastAPI (ML Inference)
# Credentials are set via Render Dashboard (marked sync: false)
# ─────────────────────────────────────────────────────────
services:
  # ── Node.js Main Server (API + React Frontend) ──────
  - type: web
    name: prono-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile.production
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: API_SECRET_KEY
        sync: false
      - key: INFERENCE_URL
        value: https://prono-fastapi-ibps.onrender.com
      - key: USE_MODEL_MANAGER
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: FOOTBALLDATA_KEY
        sync: false
      - key: APIFOOTBALL_KEY
        sync: false
      - key: BSD_API_KEY
        sync: false
      - key: ODDSPAPI_KEY
        sync: false
      - key: THERUNDOWN_KEY
        sync: false
      - key: ODDSAPI_IO_KEY
        sync: false
      - key: RAPIDAPI_ENABLED
        value: "false"
      # ── Odds : sources gratuites ──
      - key: SOFASCORE_ODDS_ENABLED
        value: "true"
      - key: DISABLE_SOFASCORE
        value: "false"
      - key: ODDSAPI_IO_ENABLED
        value: "true"
      # ── Odds : sources payantes désactivées ──
      - key: BSD_ENABLED
        value: "false"
      - key: THERUNDOWN_ENABLED
        value: "false"
      - key: ODDSPAPI_ENABLED
        value: "false"
      - key: SPORTMONKS_ENABLED
        value: "false"
      - key: APIFOOTBALL_ENABLED
        value: "false"
      - key: BIGBALLS_ENABLED
        value: "false"
      - key: PREDIXSPORT_ENABLED
        value: "false"
      - key: SPORTAPI_ENABLED
        value: "false"

  # ── Python FastAPI Inference (ML/XGBoost Engine) ────
  - type: web
    name: prono-fastapi
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: API_SECRET_KEY
        sync: false
