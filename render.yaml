envVarGroups:
  - name: prono-database
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false

notifications:
  - type: email
    to: hamdi@example.com  # ← Remplace par ton email Render
    events:
      - deploy_failure
      - service_down
  - type: slack
    webhookUrl: https://hooks.slack.com/services/...  # ← Optionnel, à configurer depuis le Dashboard
    events:
      - deploy
      - deploy_failure

services:
  # ── Node.js Web App (Compte 1) ──────────────────────────
  - type: web
    name: prono
    env: node
    plan: free
    healthCheckPath: /health
    buildCommand: PUPPETEER_SKIP_DOWNLOAD=true npm install --omit=dev && npm run build
    startCommand: node --expose-gc --max-old-space-size=256 server.js
    envVars:
      - fromGroup: prono-database
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # ── Clés non-sensibles (peuvent rester dans le YAML) ──
      - key: INFERENCE_URL
        value: https://prono-fastapi-cnxf.onrender.com
      - key: SCRAPER_WORKER_URL
        value: https://prono-scraper.onrender.com
      - key: VITE_API_URL
        value: https://prono-k6gc.onrender.com
      - key: DISABLE_SOFASCORE
        value: "true"
      - key: SCRAPING_BYPASS_ENABLED
        value: "true"
      - key: HTTP_SCRAPER_ENABLED
        value: "true"
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: BBS_ENABLED
        value: "true"
      - key: ODDSAPI_IO_ENABLED
        value: "true"
      - key: PREDIXSPORT_ENABLED
        value: "true"
      - key: RAPIDAPI_ENABLED
        value: "true"
      - key: RAPIDAPI_HOST
        value: sportapi7.p.rapidapi.com
      - key: RAPIDAPI_DAILY_LIMIT
        value: "20"
      # ── ⚠️  SECRETS : À ajouter manuellement dans Render Dashboard → Environment ──
      - key: API_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BBS_API_KEY
        sync: false
      - key: ODDSAPI_IO_KEY
        sync: false
      - key: PREDIXSPORT_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: SPORTMONKS_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: BSD_API_KEY
        sync: false
      - key: FOOTBALLDATA_KEY
        sync: false
      - key: APIFOOTBALL_KEY
        sync: false
      - key: THERUNDOWN_KEY
        sync: false
      - key: ODDSPAPI_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: LOCAL_DATA_URL
        sync: false
      - key: ARCHIVE_DOWNLOAD_URL
        value: https://files.catbox.moe/hdrmf2.gz
      - key: PREMIUM_CSV_URL
        value: https://files.catbox.moe/v2qjeu.csv
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLEARSPORTS_API_KEY
        sync: false
      - key: SPORTAPI_KEY
        sync: false
      - key: APININJAS_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: SCRAPERAPI_KEY
        sync: false
      - key: OPENWEATHER_KEY
        sync: false
