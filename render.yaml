services:
  - type: web
    name: prono
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node --max-old-space-size=400 server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: FOOTBALLDATA_ENABLED
        value: "true"
      - key: FOOTBALLDATA_KEY
        sync: false
      - key: FOOTBALLDATA_HOST
        value: footballdata.io
      - key: FOOTBALLDATA_DAILY_LIMIT
        value: "20"
      - key: RAPIDAPI_ENABLED
        value: "true"
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_HOST
        value: sportapi7.p.rapidapi.com
      - key: RAPIDAPI_DAILY_LIMIT
        value: "20"
      - key: HTTP_SCRAPER_ENABLED
        value: "true"
      - key: API_SECRET_KEY
        sync: false
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: VITE_API_URL
        value: https://prono-k6gc.onrender.com
      # API sources (keys set manually on dashboard — sync: false)
      - key: BSD_API_KEY
        sync: false
      - key: THERUNDOWN_KEY
        sync: false
      - key: ODDSPAPI_KEY
        sync: false
      - key: SPORTMONKS_KEY
        sync: false
      - key: APIFOOTBALL_KEY
        sync: false
      - key: OPENWEATHER_KEY
        sync: false
      # Supabase (PostgreSQL cloud persistence)
      - key: SUPABASE_ENABLED
        value: "true"
      - key: SUPABASE_URL
        sync: false
      # Telegram bot
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Python FastAPI inference (Railway or other external host)
      - key: INFERENCE_URL
        value: https://prono-inference.up.railway.app
        # Changez cette URL après avoir créé le service Railway
