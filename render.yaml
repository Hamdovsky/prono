services:
  # ── Node.js Web App (Compte 1) ──────────────────────────
  - type: web
    name: prono
    env: node
    plan: free
    healthCheckPath: /health
    buildCommand: PUPPETEER_SKIP_DOWNLOAD=true npm install && npm run build
    startCommand: node --expose-gc --max-old-space-size=256 server.js
    envVars:
      - fromGroup: prono-database
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
