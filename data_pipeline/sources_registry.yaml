# sources_registry.yaml — Registre centralisé des sources de données du projet stitch.
#
# Format : chaque source a les champs suivants
#   name          : identifiant unique (utilisé dans le code)
#   type          : CSV | JSON | API | PYTHON | MODEL | COMPUTED
#   url           : URL principale (GitHub, API, site)
#   license       : licence juridique
#   commercial_ok : true = usage commercial OK, false = research/non-commercial only
#   data_types    : liste des types de données fournies
#   leagues       : liste des pays/ligues couvertes (ou "GLOBAL")
#   historical    : profondeur historique (ex: "2003-present", "1872-2026")
#   freshness     : UPDATED_DAILY | UPDATED_WEEKLY | UPDATED_MONTHLY | STATIC | REALTIME
#   access       : DIRECT_CSV | GIT_CLONE | API_KEY_FREE | HTTP_GET | SCRAPING
#   independence : PRIMARY | SECONDARY | DERIVED | MODEL
#   origin       : d'où viennent les données (liga directe, agrégat, scraping, calcul)
#   reliability  : score 0-100
#   stability    : score 0-100 (uptime / régularité des mises à jour)
#   coverage     : score 0-100 (couverture ligue/marché)
#   freshness_score: score 0-100 (fraîcheur des données)
#   status       : ACTIVE | STALE | ARCHIVED | BLOCKED
#   last_verified: date de dernière vérification (YYYY-MM-DD)
#   notes        : remarques (limitations, particularités)
#
# RÈGLES D'UTILISATION :
#   - Une source avec commercial_ok=false ne doit PAS servir de base à un service commercial
#   - Une source avec independence=MODEL ou COMPUTED = calcul local (pas une source externe)
#   - BLOCKED = ne pas essayer de contourner (Cloudflare, 403, CAPTCHA)

