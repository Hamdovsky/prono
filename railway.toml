[build]
builder = "NIXPACKS"
nixpacksConfig = """
{ "phases": { "setup": { "nixPkgs": ["python310"] } } }
"""

[deploy]
startCommand = "uvicorn core.fastapi_server:app --host 0.0.0.0 --port $PORT"

[service]
name = "titanium-inference"

[environments]
  [environments.production]
    PYTHONPATH = "/app/core"
